<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Yellow Background - Middle border layer between coral-red outer frame -->
  <path fill="#ffd404" d="M4.95 4.95h118.12v118.12H4.95z"/>
  
  <!-- Coral-Red Top Border - Upper frame element -->
  <path fill="#f56356" d="M4.95 4.95h118.12v11.07H4.95z"/>
  
  <!-- Coral-Red Bottom Border - Lower frame element -->
  <path fill="#f56356" d="M4.95 111.98h118.12v11.07H4.95z"/>
  
  <!-- First Purple Stripe (Top) - Dark purple horizontal bar -->
  <g id="purple-stripes">
    <path fill="#6e6ece" d="M16.02 16.02H112V27.6H16.02z"/>
    
    <!-- Second Stripe (Light Purple) - Alternating light purple bar -->
    <path fill="#9d9de1" d="M16.02 50.73H112v11.58H16.02z"/>
    
    <!-- Third Stripe (Dark Purple) - Large bottom section -->
    <path fill="#6e6ece" d="M16.02 62.29H112v49.69H16.02z"/>
    
    <!-- Fourth Stripe (Dark Purple) - Middle dark purple bar -->
    <path fill="#6e6ece" d="M16.02 39.16H112v11.57H16.02z"/>
    
    <!-- Fifth Stripe (Light Purple) - Second from top light purple bar -->
    <path fill="#9d9de1" d="M16.02 27.58H112v11.58H16.02z"/>
  </g>
  
  <!-- White Reflection Lines - Diagonal glare effect on window surface -->
  <g id="reflection-glare">
    <!-- First diagonal reflection line (longer) -->
    <path fill="#fff" d="M24.07 81.73c-.47 0-.95-.18-1.3-.55-.72-.71-.72-1.88 0-2.62l9.06-9.05c.71-.72 1.88-.72 2.61 0 .72.72.72 1.88 0 2.62l-9.05 9.05c-.39.37-.86.55-1.32.55"/>
    
    <!-- Second diagonal reflection line (shorter, parallel) -->
    <path fill="#fff" d="M31.57 85.51c-.46 0-.95-.18-1.3-.55-.71-.71-.71-1.88 0-2.61l5.32-5.32c.72-.71 1.88-.71 2.62 0 .71.72.71 1.88 0 2.62l-5.32 5.31c-.37.37-.85.55-1.32.55"/>
  </g>
  
</svg>