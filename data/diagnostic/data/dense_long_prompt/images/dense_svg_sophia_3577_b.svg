<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Background - Cyan-blue rounded square with 32px radius corners -->
  <!-- Path creates a square from (0,0) to (128,128) with rounded corners at bottom-left and top-right -->
  <g id="background">
    <path 
      fill="#00adff" 
      d="M128 128H32c-17.6 0-32-14.4-32-32V0h96c17.6 0 32 14.4 32 32z"/>
  </g>
  
  <!-- Play Icon - #dc2626 right-pointing triangle centered on canvas -->
  <!-- Triangle vertices: left point (48,32), right point (80,64), left point (48,96) -->
  <g id="play-icon">
    <path 
      fill="#dc2626" 
      d="M80 64 48 96V32z"/>
  </g>
  
</svg>