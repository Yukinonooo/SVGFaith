      d="M66.44 5.48 83.78 40.6c.4.8 1.18 1.38 2.06 1.5l38.76 5.62c2.24.32 3.16 3.1 1.52 4.68L98.08 79.74c-.64.64-.94 1.54-.78 2.44l6.62 38.6c.4 2.24-1.96 3.96-3.98 2.88l-34.68-18.22c-.8-.42-1.76-.42-2.56 0l-34.68 18.22c-2.02 1.06-4.36-.66-3.98-2.88l6.62-38.6c.14-.88-.14-1.8-.78-2.44L1.86 52.4c-1.62-1.58-.72-4.34 1.52-4.68l38.76-5.62c.88-.12 1.66-.7 2.06-1.5L61.54 5.48c1-2.04 3.9-2.04 4.9 0"/>
    <!-- Path breakdown:
         - Starts at top point (66.44, 5.48)
