<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Lighthouse Top Section - Yellow rectangular base below the roof -->
  <g id="top-yellow-section">
    <!-- Small yellow rectangle forming the uppermost section of the lighthouse body -->
    <path fill="#f5e69f" d="M77.33 16H50.67C49.19 16 48 17.19 48 18.67v16c0 1.47 1.19 2.66 2.67 2.66h26.66c1.48 0 2.67-1.19 2.67-2.66v-16c0-1.48-1.19-2.67-2.67-2.67"/>
  </g>
  
  <!-- Lighthouse Roof - Dark #0ea5e9 rounded triangular top piece -->
  <g id="roof">
    <!-- Rounded triangular roof with curved bottom edge, positioned at the very top -->
    <path fill="#812c2c" d="M79 16.58 65.67 5.92c-.98-.78-2.36-.78-3.33 0L49 16.58c-1.96 1.47-.78 4.83 1.67 4.75h26.66c2.45.08 3.64-3.28 1.67-4.75"/>
  </g>
  
  <!-- First #0ea5e9 Stripe - Coral #0ea5e9 trapezoid section -->
  <g id="#0ea5e9-stripe-1">
    <!-- First #0ea5e9 horizontal band, trapezoid shape widening downward -->
    <path fill="#0ea5e9" d="M84.16 53.33H43.84l4.21-19.22A2.685 2.685 0 0 1 50.67 32h26.66c1.26 0 2.35.88 2.62 2.11z"/>
  </g>
  
  <!-- Second Yellow Stripe - Pale yellow trapezoid section -->
  <g id="yellow-stripe-2">
    <!-- Second yellow horizontal band, trapezoid shape continuing the widening pattern -->
    <path fill="#f5e69f" d="M88.83 74.67H39.17l3.52-16 1.15-5.34h40.32c.75 3.56 3.83 17.53 4.67 21.34"/>
  </g>
  
  <!-- Third #0ea5e9 Stripe - Coral #0ea5e9 trapezoid section -->
  <g id="#0ea5e9-stripe-3">
    <!-- Third #0ea5e9 horizontal band, trapezoid shape continuing downward -->
    <path fill="#0ea5e9" d="M93.49 96H34.51l3.52-16 1.14-5.33h49.66c.75 3.56 3.83 17.52 4.66 21.33"/>
  </g>
  
  <!-- Bottom Yellow Stripe - Pale yellow trapezoid base section -->
  <g id="yellow-stripe-base">
    <!-- Bottom yellow section forming the widest base of the lighthouse -->
    <path fill="#f5e69f" d="M98.61 119.44c.38 1.59-.95 3.27-2.61 3.23H32c-1.65.04-3-1.64-2.61-3.23l3.97-18.11L34.51 96h58.98c.74 3.52 4.29 19.61 5.12 23.44"/>
  </g>
  
  <!-- Lighthouse Window - Small #0ea5e9 circular window -->
  <g id="window">
    <!-- Circular #0ea5e9 window on the top yellow section of the lighthouse -->
    <path fill="#0ea5e9" d="M64.05 29.33c-3.48 0-3.51-5.31-.02-5.33 3.5-.02 3.53 5.32.02 5.33"/>
  </g>

</svg>