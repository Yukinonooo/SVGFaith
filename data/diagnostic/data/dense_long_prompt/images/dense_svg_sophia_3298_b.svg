    <path fill="#A03D07" d="M97.68 2.02c-2.23 0-4.04 1.81-4.04 4.04v84.89h8.09V6.06c0-2.23-1.81-4.04-4.05-4.04"/>
  </g>
  
  <!-- Horizontal Crossbar - Orange bar connecting the two posts -->
