    <path fill="#FF7039" d="M125.98 53.22v2.7a2.7 2.7 0 0 1-2.7 2.69H4.72a2.7 2.7 0 0 1-2.7-2.69v-2.7c0-1.49 1.21-2.69 2.7-2.69h118.56c1.49 0 2.7 1.2 2.7 2.69"/>
  </g>
  
  <!-- Left Ground Section - Gray rounded rectangle on left side -->
  <g id="left-ground">
    <!-- Gray section with rounded corner, positioned below left post -->
    <path fill="#727C7C" d="M45.14 93.64c0 1.49-1.21 2.7-2.7 2.7H4.72c-1.49 0-2.7-1.21-2.7-2.7v-5.39c0-1.49 1.21-2.69 2.7-2.69h32.33c4.47 0 8.09 3.62 8.09 8.08"/>
  </g>
  
  <!-- Right Ground Section - Gray rounded rectangle on right side -->
  <g id="right-ground">
    <!-- Gray section with rounded corner, positioned below right post -->
    </g>

</svg>