    <path fill="#A03D07" d="M34.36 6.06v84.89h-8.09V6.06c0-2.23 1.81-4.04 4.05-4.04 2.23 0 4.04 1.81 4.04 4.04"/>
  </g>
  
  <!-- Right Vertical Post - Brown window frame on right side -->
  <g id="right-post">
