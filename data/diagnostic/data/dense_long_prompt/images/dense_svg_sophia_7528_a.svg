<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Teal Middle Scoop - Second ice cream scoop layer -->
  <g id="middle-scoop">
    <!-- Main teal circular scoop centered at (64, 55.49) with radius 19.19 -->
    <path fill="#7fcac9" d="M83.21 55.49c0 10.6-8.59 19.19-19.19 19.19s-19.2-8.59-19.2-19.19 8.6-19.2 19.2-19.2 19.19 8.6 19.19 19.2"/>
  </g>
  
  <!-- Pink Top Scoop - Uppermost ice cream scoop layer -->
  <g id="top-scoop">
    <!-- Main pink circular scoop centered at (64, 21.36) with radius 19.2 -->
    <path fill="#f98c96" d="M83.21 21.36c0 10.6-8.59 19.2-19.19 19.2s-19.2-8.6-19.2-19.2 8.6-19.19 19.2-19.19 19.19 8.59 19.19 19.19"/>
  </g>
  
  <!-- Pink Scoop Decorations - Toppings and texture elements on pink scoop -->
  <g id="pink-scoop-toppings">
    <!-- Small circular topping on left side of pink scoop -->
    <path fill="#e9686a" d="M61.88 14.96c0 2.36-1.9 4.27-4.26 4.27s-4.27-1.91-4.27-4.27c0-2.35 1.91-4.26 4.27-4.26s4.26 1.91 4.26 4.26"/>
    <!-- Small circular topping on right side of pink scoop -->
    <path fill="#e9686a" d="M74.68 27.76a4.266 4.266 0 1 1-8.531.009 4.266 4.266 0 0 1 8.531-.009"/>
    <!-- Small square topping on left side of pink scoop -->
    <path fill="#e9686a" d="M51.22 21.36h4.27v4.27h-4.27z"/>
    <!-- Small square topping on upper right of pink scoop -->
    <path fill="#e9686a" d="M72.55 8.57h4.26v4.26h-4.26z"/>
  </g>
  
  <!-- Teal Scoop Decorations - Toppings and texture elements on teal scoop -->
  <g id="teal-scoop-toppings">
    <!-- Small circular topping on right side of teal scoop -->
    <path fill="#238892" d="M74.68 49.09a4.266 4.266 0 1 1-8.529-.011 4.266 4.266 0 0 1 8.529.011"/>
    <!-- Small circular topping on lower left of teal scoop -->
    <path fill="#238892" d="M59.75 59.75a4.266 4.266 0 1 1-8.531.009 4.266 4.266 0 0 1 8.531-.009"/>
    <!-- Small square topping on left side of teal scoop -->
    <path fill="#238892" d="M55.49 46.96h4.26v4.26h-4.26z"/>
  </g>
  
  <!-- Brown Separator Bar - Horizontal divider between scoops and cone -->
  <g id="separator-bar">
    <!-- Rectangular bar spanning width of ice cream -->
    <path fill="#d3843d" d="M44.82 66.15h38.39v12.8H44.82z"/>
  </g>
  
  <!-- Peach Cone Base - Waffle cone trapezoid shape -->
  <g id="cone-base">
    <!-- Trapezoid forming the cone, narrowing from top to bottom -->
    <path fill="#f6bf9b" d="M64.03 125.87h-.02c-3.63 0-6.69-1.82-7.1-4.23l-5.69-42.69h25.59l-5.69 42.69c-.4 2.41-3.45 4.23-7.09 4.23"/>
  </g>
  
</svg>