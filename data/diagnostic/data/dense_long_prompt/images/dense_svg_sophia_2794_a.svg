<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Domino Tile Border - Purple rounded rectangle frame with outer and inner borders -->
  <g id="tile-border">
    <!-- Outer border: Creates the main purple frame of the domino tile -->
    <path fill="#662d91" d="M82.6 5.18H45.4c-5.46 0-9.9 4.44-9.9 9.9v97.84c0 5.46 4.44 9.9 9.9 9.9h37.2c5.46 0 9.9-4.44 9.9-9.9V15.08c0-5.46-4.44-9.9-9.9-9.9m5.9 107.74c0 3.26-2.64 5.9-5.9 5.9H45.4c-3.26 0-5.9-2.64-5.9-5.9V15.08c0-3.26 2.64-5.9 5.9-5.9h37.2c3.26 0 5.9 2.64 5.9 5.9z"/>
  </g>
  
  <!-- Horizontal Divider - Red line separating upper and lower halves of domino -->
  <g id="divider-line">
    <!-- Center horizontal bar with rounded ends (stroke-linecap) -->
    <path fill="#ed1c24" d="M87.42 64c0 1.1-.9 2-2 2H42.58c-1.1 0-2-.9-2-2s.9-2 2-2h42.84c1.1 0 2 .9 2 2"/>
  </g>
  
  <!-- Upper Half Pip - Single large red circle representing value of 1 -->
  <g id="upper-pip">
    <!-- Center circle in upper section, radius ~14.66 -->
    <path fill="#ed1c24" d="M78.68 36c0 8.1-6.58 14.66-14.68 14.66S49.32 44.1 49.32 36 55.9 21.34 64 21.34 78.68 27.9 78.68 36"/>
  </g>
  
  <!-- Lower Half Pips - Three red circles arranged diagonally representing value of 3 -->
  <g id="lower-pips">
    <!-- Bottom-right pip (radius ~5.18) -->
    <path fill="#ed1c24" d="M82.42 106.2c0 2.86-2.32 5.18-5.18 5.18-2.84 0-5.16-2.32-5.16-5.18 0-2.84 2.32-5.16 5.16-5.16 2.86 0 5.18 2.32 5.18 5.16"/>
    
    <!-- Top-left pip (radius ~5.16) -->
    <path fill="#ed1c24" d="M55.92 79.34c0 2.84-2.32 5.16-5.16 5.16-2.86 0-5.18-2.32-5.18-5.16 0-2.86 2.32-5.18 5.18-5.18 2.84 0 5.16 2.32 5.16 5.18"/>
    
    <!-- Center pip (radius ~5.16) -->
    <path fill="#ed1c24" d="M69.16 93.38a5.16 5.16 0 1 1-10.32 0c0-2.86 2.3-5.18 5.16-5.18s5.16 2.32 5.16 5.18"/>
  </g>
  
</svg>