<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Main Rubber Cup Body - Dark red outer structure including dome and base -->
  <g id="cup-body">
    <!-- Outer cup dome and rectangular base plate -->
    <path fill="#b62025" d="M89.6 106.67c0-11.15-7.12-20.63-17.07-24.14v-9.99H55.47v9.99c-9.95 3.51-17.07 12.99-17.07 24.14h-4.27v8.53h59.74v-8.53zm-42.67 0c0-9.44 7.64-17.07 17.07-17.07s17.07 7.63 17.07 17.07z"/>
  </g>
  
  <!-- Inner Cup Highlight - Light pink semicircular interior reflection -->
  <g id="cup-interior-highlight">
    <!-- Inner dome showing the hollow interior of the cup -->
    <path fill="#fceaed" d="M81.07 106.67c0-9.44-7.64-17.07-17.07-17.07-9.42 0-17.07 7.63-17.07 17.07z"/>
  </g>
  
  <!-- Cup Side Shadows - Darker red shading on edges for depth -->
  <g id="cup-edge-shadows">
    <!-- Right edge shadow -->
    <path fill="#8c2025" d="M81.07 106.67h8.53c0-1.76-.18-3.47-.51-5.12h-8.8c.5 1.62.78 3.33.78 5.12"/>
    <!-- Left edge shadow -->
    <path fill="#8c2025" d="M47.71 101.55h-8.8c-.33 1.65-.51 3.36-.51 5.12h8.53c0-1.79.28-3.5.78-5.12"/>
  </g>
  
  <!-- Wooden Handle - Tan cylindrical handle extending upward -->
  <g id="handle">
    <!-- Long vertical rounded rectangle forming the main handle -->
    <path fill="#c3996b" d="M68.27 72.54V17.07c0-2.36-1.91-4.27-4.27-4.27s-4.27 1.91-4.27 4.27v55.47z"/>
  </g>
  
  <!-- Handle Connector - Darker brown piece joining handle to cup -->
  <g id="handle-connector">
    <!-- Rectangular connector piece at base of handle -->
    <path fill="#a87c4f" d="M59.73 67.42h8.54v5.12h-8.54z"/>
  </g>
  
  <!-- Top Cup Connector Shadow - Dark red shadow at handle-cup junction -->
  <g id="cup-top-shadow">
