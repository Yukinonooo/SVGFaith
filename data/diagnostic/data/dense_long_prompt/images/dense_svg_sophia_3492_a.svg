    <path fill="#8c2025" d="M64 81.07c2.99 0 5.86.52 8.53 1.46v-4.3c-2.7-.82-5.56-1.26-8.53-1.26s-5.83.45-8.53 1.26v4.3A25.6 25.6 0 0 1 64 81.07"/>
  </g>
  
  <!-- Cup Interior Gradient - Additional light pink shading for interior depth -->
  <g id="cup-interior-gradient">
    <!-- Gradient highlight showing interior curvature and depth -->
    <path fill="#f9ccd2" d="M80.29 101.55H52.85c1.93-6.13 7.22-10.76 13.71-11.74-.84-.12-1.69-.21-2.56-.21-9.42 0-17.07 7.63-17.07 17.07h34.14c0-1.79-.28-3.5-.78-5.12"/>
  </g>
  
</svg>