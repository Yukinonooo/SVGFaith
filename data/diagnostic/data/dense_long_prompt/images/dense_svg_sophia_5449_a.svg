<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Lid Top Surface - Main visible portion of the hinged lid -->
  <g id="lid-top">
    <!-- Rounded rectangular lid surface in mint-green -->
    <path fill="#92e0c4" d="M104.5 1.88h-81c-6.2 0-11.38 4.74-11.92 10.92l-1.55 25.66h107.94l-1.55-25.66c-.54-6.18-5.72-10.92-11.92-10.92"/>
  </g>
  
  <!-- Lid Right Edge Shadow - Adds depth to the right side of the lid -->
  <g id="lid-shadow-right">
    <!-- Darker teal accent on right edge for 3D effect -->
    <path fill="#77d1b3" d="M116.42 12.8c-.54-6.18-5.72-10.92-11.92-10.92h-7.53c6.2 0 11.37 4.74 11.92 10.92l1.54 25.66h7.54z"/>
  </g>
  
  <!-- Lid Underside/Rim - The bottom edge of the lid that overlaps the body -->
  <g id="lid-underside">
    <!-- Darker teal rim section creating the lid's bottom edge -->
    <path fill="#67b59f" d="M114.52 47.25H13.48a3.45 3.45 0 0 1-3.45-3.45v-5.34h107.94v5.34a3.45 3.45 0 0 1-3.45 3.45"/>
  </g>
  
  <!-- Main Bin Body - The primary container section -->
  <g id="bin-body">
    <!-- Large rounded rectangular body in mint-green -->
    <path fill="#92e0c4" d="M103.74 112.83H24.26c-4.18 0-7.56-3.51-7.56-7.83l-2.43-57.75h99.46L111.3 105c0 4.32-3.38 7.83-7.56 7.83"/>
  </g>
  
  <!-- Body Right Edge Shadow - Adds depth to the right side of the body -->
  <g id="body-shadow-right">
    <!-- Darker teal accent on right edge for 3D effect -->
    <path fill="#77d1b3" d="M106.2 47.25 103.77 105c0 4.32-3.39 7.83-7.57 7.83h7.54c4.18 0 7.56-3.51 7.56-7.83l2.43-57.75z"/>
  </g>
  
  <!-- Left Leg - Left cylindrical support at the bottom -->
  <g id="leg-left">
    <!-- Rounded rectangular leg in darker teal -->
    <path fill="#67b59f" d="M29.37 126.12c-2.25 0-4.08-1.83-4.08-4.08v-9.21h8.16v9.21c0 2.25-1.82 4.08-4.08 4.08"/>
  </g>
  
  <!-- Right Leg - Right cylindrical support at the bottom -->
  <g id="leg-right">
    <!-- Rounded rectangular leg in darker teal, mirroring left leg -->
    <path fill="#67b59f" d="M98.63 126.12c-2.26 0-4.08-1.83-4.08-4.08v-9.21h8.16v9.21c0 2.25-1.83 4.08-4.08 4.08"/>
  </g>

</svg>