  </g>
  
  <!-- Main Carton Body - Black container structure with compartments -->
  <g id="carton-body">
    <!-- Main carton structure with cutouts at the base for stability -->
    </g>
  
  <!-- Carton Rim - Horizontal edge strip at the top of the carton -->
  <g id="carton-rim">
    <!-- Top rim spanning the full width of the carton -->
    <path d="M1.88 76.84h124.24v7.5H1.88z"/>
  </g>
  
  <!-- Left Carton Detail - Additional structural element on left side -->
