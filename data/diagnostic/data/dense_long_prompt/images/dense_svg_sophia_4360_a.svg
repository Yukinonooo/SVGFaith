<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Roof/Crown - Tan rectangular cap at the top of the building -->
  <g id="roof">
    <path fill="#c6b39d" d="M29.87 2.13h68.26V19.2H29.87z"/>
  </g>
  
  <!-- Foundation - Dark brown base strip at ground level -->
  <g id="foundation">
    <path fill="#bf720d" d="M115.2 117.33H2.13v8.54h123.74v-8.54z"/>
  </g>
  
  <!-- Ground Floor - Bright orange lower section with cutouts for storefronts -->
  <g id="ground-floor">
    <path fill="#ff9811" d="M123.73 87.47v29.86h-8.53v-17.06H72.53v17.06H55.47v-17.06H12.8v17.06H4.27V87.47z"/>
  </g>
  
  <!-- Main Building Body - Peach-orange middle section containing windows -->
  <g id="main-body">
    <path fill="#ffc170" d="M12.8 19.2h102.4v68.27H12.8z"/>
  </g>
  
  <!-- Storefront Openings - Two tan rectangular door/storefront openings -->
  <g id="storefronts">
    <!-- Left storefront opening -->
    <path fill="#c6b39d" d="M12.8 100.27h42.67v17.06H12.8z"/>
    <!-- Right storefront opening -->
    <path fill="#c6b39d" d="M72.53 100.27h42.67v17.06H72.53z"/>
  </g>
  
  <!-- Window Grid - 12 orange square windows in 3 rows of 4 columns -->
  <g id="windows">
    <!-- Top row of windows -->
    <path fill="#ff9811" d="M21.33 25.6h12.8v12.8h-12.8z"/>
    <path fill="#ff9811" d="M44.8 25.6h12.8v12.8H44.8z"/>
    <path fill="#ff9811" d="M70.4 25.6h12.8v12.8H70.4z"/>
    <path fill="#ff9811" d="M93.87 25.6h12.8v12.8h-12.8z"/>
    
    <!-- Middle row of windows -->
    <path fill="#ff9811" d="M21.33 46.93h12.8v12.8h-12.8z"/>
    <path fill="#ff9811" d="M44.8 46.93h12.8v12.8H44.8z"/>
    <path fill="#ff9811" d="M70.4 46.93h12.8v12.8H70.4z"/>
    <path fill="#ff9811" d="M93.87 46.93h12.8v12.8h-12.8z"/>
    
    <!-- Bottom row of windows -->
    <path fill="#ff9811" d="M21.33 68.27h12.8v12.8h-12.8z"/>
    <path fill="#ff9811" d="M44.8 68.27h12.8v12.8H44.8z"/>
    <path fill="#ff9811" d="M70.4 68.27h12.8v12.8H70.4z"/>
    <path fill="#ff9811" d="M93.87 68.27h12.8v12.8h-12.8z"/>
  </g>

</svg>