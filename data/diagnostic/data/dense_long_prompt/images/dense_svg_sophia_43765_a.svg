<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 
    Group for the entire device icon.
    fill-rule="evenodd" is crucial here because the frame is created 
    by subtracting the inner shape from the outer shape.
  -->
  <g fill="black" fill-rule="evenodd">
    
    <!-- 1. Device Frame -->
    <!-- 
      Consists of two sub-paths:
      1. The inner rounded rectangle (counter-clockwise)
      2. The outer rounded rectangle (clockwise)
      Together they form the casing.
    -->
    <path id="device-frame" d="
      M124 118c0 3.31-2.69 6-6 6H10c-3.31 0-6-2.69-6-6V10c0-3.31 2.69-6 6-6h108c3.31 0 6 2.69 6 6z
      M118 0H10A10 10 0 0 0 0 10v108a10 10 0 0 0 10 10h108a10 10 0 0 0 10-10V10a10 10 0 0 0-10-10
    "/>

    <!-- 2. Right Sliders -->
    <!-- 
      Two vertical sliders with handle bars.
      Starts at absolute position (116, 96).
    -->
    <path id="right-sliders" d="
      M116 96h-2V78a2 2 0 0 0-4 0v18h-2c-1.1 0-2 .9-2 2s.9 2 2 2h2v18a2 2 0 0 0 4 0v-18h2c1.1 0 2-.9 2-2s-.9-2-2-2
