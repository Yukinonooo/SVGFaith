    "/>

    <!-- 3. Top Right Indicators -->
    <!-- 
      Small pill shapes above the sliders.
      Starts at absolute position (102, 20).
    -->
    <path id="top-right-indicators" d="
      M102 20h-4c-1.1 0-2 .9-2 2s.9 2 2 2h4c1.1 0 2-.9 2-2s-.9-2-2-2
      m8 4h4c1.1 0 2-.9 2-2s-.9-2-2-2h-4c-1.1 0-2 .9-2 2s.9 2 2 2
      m-8-12h-4c-1.1 0-2 .9-2 2s.9 2 2 2h4c1.1 0 2-.9 2-2s-.9-2-2-2
      m8 4h4c1.1 0 2-.9 2-2s-.9-2-2-2h-4c-1.1 0-2 .9-2 2s.9 2 2 2
    "/>

    <!-- 4. Top Left Indicators -->
    <!-- 
      Row of indicators on the top left side.
      Starts at absolute position (36, 14).
    -->
    <path id="top-left-indicators" d="
      M36 14c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2s.9 2 2 2h4c1.1 0 2-.9 2-2
