  <!-- Bottom Floral Decoration - Light blue stylized flower motif at bottom of egg -->
  <g id="bottom-decoration">
    <!-- Mirror of top decoration, creating vertical symmetry -->
    </g>
  
  <!-- Middle Horizontal Band - Wide pink stripe across center of egg -->
  <g id="middle-band">
    <!-- Horizontal band spanning from y=50 to y=78, creating the main decorative stripe -->
    <path fill="#f2a7b1" d="M18 76c0 .68.02 1.34.04 2h91.92c.02-.66.04-1.32.04-2a100 100 0 0 0-3.61-26H21.61A100 100 0 0 0 18 76"/>
