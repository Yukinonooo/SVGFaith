    <path fill="#80b6fc" d="m38.15 24.42 20.39 56.05a2.206 2.206 0 0 0 2.82 1.31l12.52-4.56a2.19 2.19 0 0 0 1.31-2.81l-20.4-56.04a2.196 2.196 0 0 0-2.81-1.32l-12.52 4.56a2.183 2.183 0 0 0-1.31 2.81"/>
