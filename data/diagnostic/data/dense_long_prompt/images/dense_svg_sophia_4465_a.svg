<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Background - Main orange canvas representing the building interior floor -->
  <path fill="#e4a35a" d="M18 2h92v124H18z"/>
  
  <!-- Top Floor Left Section - Coral and blue furniture blocks with accents -->
  <g id="top-floor-left">
    <path fill="#e6765c" d="M18 10h8v32h-8z"/> <!-- Coral vertical block -->
    <path fill="#73b9e6" d="M26 14h12v28H26z"/> <!-- Light blue block -->
    <path fill="#9e513f" d="M18 24h8v8h-8z"/> <!-- Brown accent on coral block -->
    <path fill="#5c94b9" d="M38 10h8v32h-8z"/> <!-- Blue vertical block -->
    <path fill="#36566c" d="M38 24h8v8h-8z"/> <!-- Dark gray accent on blue block -->
    <path fill="#5c94b9" d="M26 28h12v8H26z"/> <!-- Blue accent on light blue block -->
  </g>
  
  <!-- Top Floor Center Section - Yellow furniture block with olive accent -->
  <g id="top-floor-center">
    <path fill="#e6c45c" d="M77.1 9.54h8v32h-8z"/> <!-- Yellow vertical block -->
    <path fill="#97813d" d="M76.73 23.5h8v8h-8z"/> <!-- Olive accent -->
  </g>
  
  <!-- Top Floor Right Section - Blue and coral furniture blocks -->
  <g id="top-floor-right">
    <path fill="#5c94b9" d="M102 10h8v32h-8z"/> <!-- Blue vertical block -->
    <path fill="#6a362a" d="M102 24h8v8h-8z"/> <!-- Dark brown accent -->
    <path fill="#e6765c" d="M90 14h12v28H90z"/> <!-- Coral block -->
    <path fill="#36566c" d="M90 28h12v8H90z"/> <!-- Dark gray accent on coral block -->
  </g>
  
  <!-- First Horizontal Divider - Brown separator between top and middle floors -->
  <path fill="#ac7b45" d="M18 40h92v4H18z"/>
  
  <!-- Middle Floor Left Section - Brown and yellow furniture blocks -->
  <g id="middle-floor-left">
    <path fill="#9e513f" d="M18 50h12v36H18z"/> <!-- Brown vertical block -->
    <path fill="#e6c45c" d="M18 64h12v12H18z"/> <!-- Yellow accent on brown block -->
    <path fill="#5c94b9" d="M30 54h8v32h-8z"/> <!-- Blue vertical block -->
    <path fill="#36566c" d="M30 70h8v8h-8z"/> <!-- Dark gray accent -->
  </g>
  
  <!-- Middle Floor Right Section - Coral, blue, and yellow furniture blocks -->
  <g id="middle-floor-right">
    <path fill="#e6765c" d="M98 50h12v36H98z"/> <!-- Coral vertical block -->
    <path fill="#36566c" d="M98 64h12v12H98z"/> <!-- Dark gray accent -->
    <path fill="#5c94b9" d="M90 54h8v32h-8z"/> <!-- Blue vertical block -->
    <path fill="#6a362a" d="M90 70h8v8h-8z"/> <!-- Dark brown accent -->
    <path fill="#e6c45c" d="M82 54h8v32h-8z"/> <!-- Yellow vertical block -->
    <path fill="#36566c" d="M82 70h8v8h-8z"/> <!-- Dark gray accent -->
  </g>
  
  <!-- Middle Floor Center Section - Yellow furniture block with brown accent -->
  <g id="middle-floor-center">
    <path fill="#e6c45c" d="M56 66h8v32h-8z"/> <!-- Yellow vertical block -->
    <path fill="#6a362a" d="M52 78h8v8h-8z"/> <!-- Dark brown accent block -->
  </g>
  
  <!-- Second Horizontal Divider - Brown separator between middle and bottom floors -->
  <path fill="#ac7b45" d="M18 84h92v4H18z"/>
  
  <!-- Bottom Floor Left Section - Blue and coral furniture blocks -->
  <g id="bottom-floor-left">
    <path fill="#5c94b9" d="M26 94h12v32H26z"/> <!-- Blue vertical block -->
    <path fill="#36566c" d="M26 108h12v12H26z"/> <!-- Dark gray accent -->
    <path fill="#e6765c" d="M18 94h8v32h-8z"/> <!-- Coral vertical block -->
    <path fill="#36566c" d="M18 110h8v8h-8z"/> <!-- Dark gray accent -->
  </g>
  
  <!-- Bottom Floor Right Section - Coral and blue furniture blocks -->
  <g id="bottom-floor-right">
    <path fill="#e6765c" d="M102 94h8v32h-8z"/> <!-- Coral vertical block -->
    <path fill="#6a362a" d="M102 110h8v8h-8z"/> <!-- Dark brown accent -->
    <path fill="#5c94b9" d="M94 94h8v32h-8z"/> <!-- Blue vertical block -->
    <path fill="#36566c" d="M94 110h8v8h-8z"/> <!-- Dark gray accent -->
  </g>
  
  <!-- Bottom Floor Center Section - Dark gray, coral, and brown furniture blocks -->
  <g id="bottom-floor-center">
    <path fill="#36566c" d="M78.53 93.63h8v32h-8z"/> <!-- Dark gray vertical block -->
    <path fill="#e6765c" d="M77.1 109.36h8v8h-8z"/> <!-- Coral accent -->
    <path fill="#6a362a" d="M63.54 95.32h8v32h-8z"/> <!-- Dark brown vertical block -->
    <path fill="#e6765c" d="M60.91 110.33h8v8h-8z"/> <!-- Coral accent -->
  </g>

</svg>