<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Light Mint Background Circle - Base layer of the citrus slice -->
  <g id="background-circle">
    <!-- Main circular fill in light mint color, radius 52px centered at (63.86, 64) -->
    <path fill="#8ae5d0" d="M63.86 12a52 52 0 1 0 52 52 52 52 0 0 0-52-52"/>
  </g>
  
  <!-- Dark Teal Outer Ring - Defines the fruit's perimeter with thick border -->
  <g id="outer-ring">
    <!-- Outer circle (radius 56px) with inner circle cutout (radius 48px) creating ring effect -->
    <path fill="#138072" d="M64 8a56 56 0 1 0 56 56A56.06 56.06 0 0 0 64 8m0 104a48 48 0 1 1 48-48 48.06 48.06 0 0 1-48 48"/>
  </g>
  
  <!-- Dark Teal Segments and Center - Eight radiating segments with dividers and central circle -->
  <g id="segments-and-center">
    <!-- Complex path defining all 8 segments radiating from center, segment dividers, and central circle -->
    <!-- Segments are arranged in rotational symmetry around the center point (64, 64) -->
    </g>

</svg>