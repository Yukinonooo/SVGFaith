<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Pedestal Base - Small foot at the bottom of the bowl -->
  <!-- Creates the 3D effect of the bowl's base using an elliptical path -->
  <g id="pedestal-base">
    <path fill="#946951" d="M82.2 102c1 1 1.6 2.2 1.6 3.4 0 4.8-8.8 8.6-19.8 8.6s-19.8-3.8-19.8-8.6c0-1.2.6-2.4 1.6-3.4"/>
  </g>
  
  <!-- Bowl Body - Main exterior surface of the bowl -->
  <!-- Curved path forming the hemispherical outer shell in lighter tan -->
  <g id="bowl-body">
    <path fill="#ceb09d" d="M114 58.8s-3.2 27.4-30.4 42.4c-12.2 6.8-27 6.8-39.2 0C17.2 86.2 14 58.8 14 58.8"/>
  </g>
  
  <!-- Bowl Rim and Interior - Top opening showing depth -->
  <!-- Elliptical shape representing the bowl's opening and inner surface in dark brown -->
  <g id="bowl-rim">
    </g>

</svg>