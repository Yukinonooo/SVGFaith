<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  
  <!-- Large Outer Peach Circle - Base layer of the bullseye pattern -->
  <!-- Circle centered at (64, 64) with radius 47.04 -->
  <g id="outer-circle">
    <path fill="#f4cca4" d="M111.04 64c0 25.92-21.12 47.04-47.04 47.04-26.88 0-48-21.12-48-47.04 0-26.88 21.12-48 48-48 25.92 0 47.04 21.12 47.04 48"/>
  </g>
  
  <!-- Magenta Ring - Middle layer creating the donut/ring effect -->
  <!-- Outer circle (radius 32) with inner cutout (radius 21.33) centered at (64, 64) -->
  <g id="middle-ring">
    <path fill="#ba135d" d="M64 96a32 32 0 1 1 32-32 32.04 32.04 0 0 1-32 32m0-53.33A21.33 21.33 0 1 0 85.33 64 21.36 21.36 0 0 0 64 42.67"/>
  </g>
  
  <!-- Inner Peach Circle - Center/top layer completing the bullseye -->
  <!-- This circle is created by the cutout in the magenta ring path above -->
  <!-- The visual effect shows through as the background peach color fills the center -->
  
</svg>